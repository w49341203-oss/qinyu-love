<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>秦宇的愛情</title>
<meta name="author" content="蕭妤真">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f17; --panel:rgba(14,16,28,.88); --panel2:#171a2b; --line:rgba(255,255,255,.14);
  --text:#f2f2f7; --dim:#a4a8bd; --accent:#f472b6; --accent2:#60a5fa; --gold:#fbbf24;
  --ok:#34d399; --bad:#f87171;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden}

/* 背景 */
#bg{position:absolute;inset:0;transition:background-color .6s}
#bg .grad{position:absolute;inset:0;background:
  linear-gradient(160deg,rgba(255,255,255,.10),transparent 40%),
  linear-gradient(0deg,rgba(0,0,0,.55),transparent 55%)}
#bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
#bg img.on{opacity:1}
#bgLabel{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);
  font-size:clamp(28px,6vw,64px);font-weight:900;letter-spacing:.2em;color:rgba(255,255,255,.10);pointer-events:none}

/* 角色 */
#chars{position:absolute;left:0;right:0;bottom:0;height:78%;display:flex;justify-content:center;align-items:flex-end;gap:2%;pointer-events:none;padding:0 4%}
.char{height:100%;flex:0 1 30%;max-width:340px;display:flex;align-items:flex-end;justify-content:center;transition:filter .3s,transform .3s;filter:brightness(.55) saturate(.7);transform:translateY(8px)}
.char.talk{filter:none;transform:none}
.char img{max-height:100%;max-width:100%;object-fit:contain}
.ph{width:100%;height:88%;position:relative;display:flex;align-items:flex-end;justify-content:center}
.ph svg{height:100%;width:auto;max-width:100%}
.ph span{position:absolute;top:18%;left:50%;transform:translateX(-50%);font-weight:900;font-size:clamp(14px,2.4vw,22px);
  background:rgba(0,0,0,.5);padding:2px 10px;border-radius:999px;white-space:nowrap}

/* 上方列 */
#top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
  background:linear-gradient(180deg,rgba(0,0,0,.6),transparent);z-index:5}
#chapWrap{flex:1;min-width:0}
#chap{display:inline-block;max-width:100%;font-size:clamp(13px,1.8vw,16px);font-weight:700;color:#f2f2f7;background:rgba(0,0,0,.5);padding:4px 12px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
#chap:empty{display:none}
#scoreBox{font-weight:900;font-size:clamp(15px,2.2vw,20px);color:var(--gold);background:rgba(0,0,0,.45);padding:4px 12px;border-radius:999px;border:1px solid rgba(251,191,36,.4)}
.iconBtn{background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:10px;min-width:40px;height:38px;font-size:18px}
.iconBtn.off{opacity:.4;filter:grayscale(1)}

/* 對話框 */
#box{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);width:min(960px,calc(100% - 24px));
  min-height:clamp(120px,22vh,190px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px 22px 20px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:4;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#name{position:absolute;top:-16px;left:18px;font-weight:900;font-size:clamp(15px,2.2vw,19px);padding:4px 16px;border-radius:10px;background:#333;box-shadow:0 4px 12px rgba(0,0,0,.4)}
#name:empty{display:none}
#text{font-size:clamp(17px,2.5vw,22px);line-height:1.75;min-height:3.5em;white-space:pre-wrap}
#text.narr{color:#dfe2f0;font-style:normal}
#next{position:absolute;right:18px;bottom:10px;color:var(--accent);animation:bob 1s infinite;font-size:14px}
@keyframes bob{50%{transform:translateY(4px)}}

/* 覆蓋層 */
.overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,6,12,.72);overflow-y:auto}
/* 題目、選項：放在畫面下方（對話框位置），上方立繪保持可見 */
.overlay.bottom{align-items:flex-end;background:linear-gradient(0deg,rgba(5,6,12,.55),transparent 60%);padding:0 12px calc(env(safe-area-inset-bottom) + 14px)}
.overlay.bottom .card{width:min(960px,100%);max-height:62%;background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:18px;padding:16px 18px}
.overlay.bottom .opts{display:grid;grid-template-columns:1fr;gap:0 10px}
@media (min-width:700px){ .overlay.bottom .opts.two{grid-template-columns:1fr 1fr} }
.overlay.bottom .btn{margin:6px 0;padding:11px 14px}
body.ovBottom #box{visibility:hidden}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:22px;width:min(720px,100%);max-height:calc(100% - 8px);overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.btn{display:block;width:100%;text-align:left;background:#22263b;border:2px solid #343a58;border-radius:14px;padding:14px 16px;margin:10px 0;font-size:clamp(16px,2.3vw,19px);line-height:1.5;transition:transform .1s,background .15s,border-color .15s}
.btn:active{transform:scale(.98)}
.btn.sel{border-color:var(--accent);background:#3a2340}
.btn.primary{text-align:center;background:linear-gradient(135deg,#ec4899,#8b5cf6);border:none;font-weight:900}
.btn.ghost{text-align:center;background:transparent}
.btn[disabled]{opacity:.45}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--gold);font-weight:900}
.qhead .tag{background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.4);padding:2px 10px;border-radius:999px;font-size:14px}
.qprompt{font-size:clamp(17px,2.5vw,21px);line-height:1.7;margin:6px 0 4px;white-space:pre-wrap}
.qtip{color:var(--dim);font-size:14px;margin-bottom:4px}
.qfig{display:block;margin:8px auto;max-width:100%;max-height:34vh;text-align:center}
.qfig svg{max-width:100%;max-height:34vh;height:auto;width:auto;border-radius:12px}
img.qfig{border-radius:12px;object-fit:contain}
/* 有圖的題目：橫向螢幕時左邊題目＋圖、右邊選項 */
@media (min-width:700px) and (orientation:landscape){
  .card.hasFig .qgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
  .card.hasFig .opts.two{grid-template-columns:1fr}
  .card.hasFig .qfig, .card.hasFig .qfig svg{max-height:42vh}
  .overlay.bottom .card.hasFig{max-height:72%}
}
.lab{display:inline-block;min-width:2em;font-weight:900;color:var(--accent2)}
.inputRow{display:flex;gap:8px;align-items:center;margin:14px 0}
.inputRow input{flex:1;min-width:0;font-size:24px;padding:12px 14px;border-radius:12px;border:2px solid #343a58;background:#0f1120;color:var(--text);font-family:inherit}
.inputRow .unit{font-size:20px;color:var(--dim)}
.seq{min-height:52px;border:2px dashed #3d4466;border-radius:12px;padding:10px 12px;font-size:22px;font-weight:900;letter-spacing:.3em;margin:10px 0}
.fb{margin-top:8px;font-weight:900;font-size:18px;min-height:1.4em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.dev{color:#22d3ee;font-size:13px;margin-top:6px}
.chapCard{text-align:center;animation:fade .5s}
.chapCard h1{font-size:clamp(28px,6vw,52px);margin:0 0 10px;letter-spacing:.08em;background:linear-gradient(135deg,#f9a8d4,#93c5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.chapCard h2{font-size:clamp(20px,4vw,32px);margin:0;color:#e5e7f0}
.chapCard p{color:var(--dim);margin-top:26px}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.title h1{font-size:clamp(40px,9vw,80px);margin:0;letter-spacing:.1em;background:linear-gradient(135deg,#f9a8d4,#fde68a,#93c5fd);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
.title .subt{text-align:center;color:var(--dim);margin:6px 0 24px}
label.f{display:block;color:var(--dim);font-size:15px;margin:10px 0 4px}
input.name{width:100%;font-size:22px;padding:12px 14px;border-radius:12px;border:2px solid #343a58;background:#0f1120;color:var(--text);font-family:inherit}

/* 成績卡 */
.result{text-align:center}
.result .who{font-size:clamp(24px,5vw,36px);font-weight:900;margin:4px 0}
.result .big{font-size:clamp(56px,14vw,110px);font-weight:900;color:var(--gold);line-height:1.1;text-shadow:0 0 30px rgba(251,191,36,.35)}
.result .max{font-size:clamp(18px,3vw,24px);color:var(--dim)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.stats div{background:#0f1120;border-radius:12px;padding:10px;font-size:15px;color:var(--dim)}
.stats b{display:block;font-size:22px;color:var(--text)}
.badge{display:inline-block;padding:4px 14px;border-radius:999px;font-weight:900;margin:6px 0}
.badge.clear{background:rgba(52,211,153,.18);color:var(--ok);border:1px solid rgba(52,211,153,.5)}
.badge.prog{background:rgba(96,165,250,.15);color:var(--accent2);border:1px solid rgba(96,165,250,.4)}

/* 全螢幕插圖 */
#cg{position:absolute;inset:0;background:#000 center/cover no-repeat;opacity:0;pointer-events:none;transition:opacity .8s;z-index:2}
#cg.on{opacity:1}
/* 結局卡、結局收集 */
.endCard{text-align:center}
.endCard .endLabel{color:var(--dim);letter-spacing:.4em;font-size:15px}
.endCard h2{font-size:clamp(28px,6vw,46px);margin:6px 0 4px;background:linear-gradient(135deg,#f9a8d4,#fde68a);-webkit-background-clip:text;background-clip:text;color:transparent}
.endDesc{color:#d9dbe8;font-size:clamp(15px,2.2vw,18px);line-height:1.7;margin:6px 0 10px}
.endNew{display:inline-block;color:#111;background:var(--gold);font-weight:900;border-radius:999px;padding:2px 12px;margin-bottom:6px}
.endList{margin:12px 0;text-align:center}
.endHead{color:var(--gold);font-weight:900;margin-bottom:8px}
.endChip{display:inline-block;margin:3px;padding:4px 12px;border-radius:999px;border:1px solid #3d4466;color:#6b7190;font-size:14px}
.endChip.on{color:#fff;border-color:var(--accent);background:rgba(236,72,153,.18)}
#ver{position:absolute;right:8px;bottom:2px;font-size:11px;color:rgba(255,255,255,.35);z-index:20;pointer-events:none}
.hidden{display:none!important}
/* 手機、平板（觸控裝置）直拿時：蓋住畫面，請玩家轉成橫向。電腦（滑鼠）不受影響 */
#rotate{display:none;position:fixed;inset:0;z-index:100;background:#0d0f17;color:#f2f2f7;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:18px}
#rotate .phone{width:64px;height:110px;border:5px solid #f9a8d4;border-radius:14px;animation:turn 2s ease-in-out infinite}
#rotate b{font-size:22px} #rotate span{color:#a4a8bd;font-size:16px;line-height:1.6}
@keyframes turn{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){ #rotate{display:flex} }
</style>
</head>
<body>
<div id="app">
  <div id="bg"><img id="bgImg" alt=""><div class="grad"></div><div id="bgLabel"></div></div>
  <div id="chars"></div>
  <div id="cg"></div>
  <div id="top">
    <div id="chapWrap"><div id="chap"></div></div>
    <div id="scoreBox">積分 0</div>
    <button class="iconBtn off" id="musicBtn" title="背景音樂">🎵</button>
    <button class="iconBtn" id="voiceBtn" title="角色語音">🔇</button>
    <button class="iconBtn" id="fsBtn" title="全螢幕">⛶</button>
    <button class="iconBtn" id="menuBtn" title="選單">☰</button>
  </div>
  <div id="box"><div id="name"></div><div id="text"></div><div id="next">▼</div></div>
  <div id="ov" class="overlay hidden"></div>
  <div id="ver">v2.8</div>
  <div id="rotate"><div class="phone"></div><b>請把手機或平板轉成橫向</b><span>這個遊戲只能橫著玩。<br>轉了沒反應的話，<br>請關閉螢幕的「直向鎖定」。</span></div>
</div>

<script src="story.js?v=2.8"></script>
<script src="figs.js?v=2.8"></script>
<script src="voice/list.js?v=2.8"></script>
<script>
'use strict';
const VERSION = 'v2.8';
const SAVE_KEY = 'qinyu_love_save_v1';
const DEV = /[?&]dev=1/.test(location.search);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LETTERS = 'ABCDEFGHIJKLMNOP'.split('');
const JIA = '甲乙丙丁戊己庚辛壬癸'.split('');
const labelsOf = (q) => q.labels === 'jia' ? JIA : LETTERS;
const MAX_SCORE = Object.values(QUESTIONS).reduce((s, q) => s + (q.pts || 10), 0);

/* ---------- 存檔（壞掉或缺欄位都不會當機） ---------- */
function storeGet(){ try { return JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch(e){ return null; } }
function storeSet(o){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(o)); } catch(e){} }
function fixState(s){
  if (!s || typeof s !== 'object') return null;
  return {
    name: String(s.name || ''), scene: STORY.scenes[s.scene] ? s.scene : STORY.start,
    idx: Number.isInteger(s.idx) && s.idx >= 0 ? s.idx : 0,
    score: Number(s.score) || 0, done: s.done && typeof s.done === 'object' ? s.done : {},
    missed: s.missed && typeof s.missed === 'object' ? s.missed : {},
    wrong: Number(s.wrong) || 0, plays: Number(s.plays) || 1, playMs: Number(s.playMs) || 0,
    bg: s.bg || null, show: Array.isArray(s.show) ? s.show : [], needCard: !!s.needCard,
    cleared: !!s.cleared, ended: !!s.ended, started: s.started || Date.now(),
    flags: s.flags && typeof s.flags === 'object' ? s.flags : {},          // 劇情旗標（例：第二季怎麼下定決心）
    endings: Array.isArray(s.endings) ? s.endings : [],                    // 這一輪看到的結局
    cg: typeof s.cg === 'string' ? s.cg : '',                              // 目前顯示的全螢幕插圖
    checkpoints: Array.isArray(s.checkpoints) ? s.checkpoints : [],        // 分歧點存檔（每個選擇前）
    chap: typeof s.chap === 'string' ? s.chap : '',                        // 目前章名
    bgm: typeof s.bgm === 'string' ? s.bgm : '',                           // 目前的背景音樂（沒指定的場景沿用）
  };
}
/* ---------- 分歧點存檔 ----------
   每次出現選擇前自動記下「劇情位置＋劇情旗標＋畫面」。
   跳回去時只還原劇情，不還原積分與答題紀錄：答過的題目不用重答，也不能靠跳回去刷分。 */
function recordCheckpoint(prompt){
  const key = S.scene + '#' + S.idx;
  const cp = {
    key, label: (S.chap || '').trim(), prompt: String(prompt || '').slice(0, 34),
    scene: S.scene, idx: S.idx, flags: JSON.parse(JSON.stringify(S.flags || {})),
    bg: S.bg, show: (S.show || []).slice(), cg: S.cg || '', bgm: S.bgm || '', t: Date.now(),
  };
  S.checkpoints = (S.checkpoints || []).filter(c => c.key !== key);
  S.checkpoints.push(cp);
  if (S.checkpoints.length > 40) S.checkpoints = S.checkpoints.slice(-40);
}
function jumpToCheckpoint(cp){
  if (!cp || !STORY.scenes[cp.scene]) return;
  S.scene = cp.scene; S.idx = cp.idx; S.needCard = false; S.ended = false;
  S.flags = JSON.parse(JSON.stringify(cp.flags || {}));
  S.bg = cp.bg; S.show = (cp.show || []).slice(); S.cg = cp.cg || ''; S.chap = cp.label || '';
  if (cp.bgm) S.bgm = cp.bgm;
  setBg(S.bg || 'classroom'); setCg(S.cg); renderChars(null);
  save(); run();
}
function showCheckpoints(){
  const list = (S.checkpoints || []).slice().reverse();   // 最近的在最上面
  const o = openOv(`<div class="card"><div class="qhead"><span class="tag">回到分歧點</span></div>
    <div class="qtip">回到選擇之前，換一個選項試試看。積分和答過的題目都會保留，不用重答。</div>
    ${list.length ? list.map((c, i) => `<button class="btn cpBtn" data-i="${i}"><span class="lab" style="min-width:auto;margin-right:8px">${esc(c.label || '分歧點')}</span>${esc(c.prompt || '')}</button>`).join('')
      : '<div class="qprompt">還沒有經過任何選擇。</div>'}
    <button class="btn ghost" id="cpBack">返回</button></div>`);
  o.onclick = e => e.stopPropagation();
  o.querySelectorAll('.cpBtn').forEach(b => b.onclick = () => jumpToCheckpoint(list[+b.dataset.i]));
  $('cpBack').onclick = () => { if (S.ended) showResult('end', true); else { closeOv(); resumeView(); } };
}
/* ---------- 結局收集（存在這台裝置，重新開始也不會清掉） ---------- */
const ENDING_KEY = 'qinyu_love_endings_v1';
function getEndings(){ try { const a = JSON.parse(localStorage.getItem(ENDING_KEY) || '[]'); return Array.isArray(a) ? a.filter(k => STORY.endings && STORY.endings[k]) : []; } catch(e){ return []; } }
function addEnding(id){ const a = getEndings(); if (!a.includes(id)) { a.push(id); try { localStorage.setItem(ENDING_KEY, JSON.stringify(a)); } catch(e){} } }
function endingListHtml(){
  const got = getEndings(), all = Object.keys(STORY.endings || {});
  return `<div class="endList"><div class="endHead">結局收集　${got.length} / ${all.length}</div>` +
    all.map(k => `<span class="endChip ${got.includes(k) ? 'on' : ''}">${got.includes(k) ? esc(STORY.endings[k].name) : '？？？'}</span>`).join('') + '</div>';
}
let S = fixState(storeGet());
function save(){ if (S) storeSet(S); }
// 重新計分（防止存檔被改過或題目改版後分數對不上）
function recalcScore(){ S.score = Object.keys(S.done).reduce((t, k) => t + (QUESTIONS[k] ? (S.done[k] ? (QUESTIONS[k].pts || 10) : 0) : 0), 0); }

/* ---------- 遊戲時間（只算畫面在前景的時間） ---------- */
setInterval(() => { if (S && !document.hidden && !S.ended) { S.playMs += 1000; if (S.playMs % 10000 === 0) save(); } }, 1000);

/* ---------- 畫面 ---------- */
const bgCache = {};
function setBg(key){
  const b = STORY.bgs[key] || { name:'', color:'#222' };
  $('bg').style.backgroundColor = b.color;
  $('bgLabel').textContent = b.name;
  const img = $('bgImg'); img.classList.remove('on');
  if (bgCache[key] === false) return;
  img.onload = () => { bgCache[key] = true; img.classList.add('on'); $('bgLabel').textContent=''; };
  img.onerror = () => { bgCache[key] = false; };
  img.src = 'img/bg_' + key + '.jpg';
}
/* 全螢幕插圖（婚禮等），蓋在背景和立繪上面、對話框下面 */
function setCg(key){
  const el = $('cg');
  if (!key) { el.classList.remove('on'); el.style.backgroundImage = ''; return; }
  el.style.backgroundImage = `url("img/cg_${key}.jpg")`;
  el.classList.add('on');
}
function silhouette(color, id){
  const gid = 'g_' + id;
  return `<svg viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".95"/><stop offset="1" stop-color="${color}" stop-opacity=".35"/></linearGradient></defs>
  <circle cx="50" cy="38" r="24" fill="url(#${gid})"/><path d="M10 200 C10 120 25 72 50 72 C75 72 90 120 90 200Z" fill="url(#${gid})"/></svg>`;
}
const charImgOk = {};
function renderChars(speaker){
  const box = $('chars'); box.innerHTML = '';
  (S.show || []).forEach(id => {
    // 'qy:smile' ＝ 秦宇的「smile」版本立繪（img/char_qy_smile.png）；找不到就退回基本版
    const [base, variant] = String(id).split(':');
    const c = STORY.chars[base] || { name:base, color:'#888' };
    const d = document.createElement('div');
    d.className = 'char' + (base === speaker || !speaker ? ' talk' : '');
    const ph = `<div class="ph">${silhouette(c.color, base)}<span>${esc(c.name)}</span></div>`;
    const file = variant && charImgOk[id] !== false ? base + '_' + variant : base;
    const key = file === base ? base : id;
    if (charImgOk[key] === false) { d.innerHTML = ph; }
    else {
      const im = new Image(); im.alt = c.name;
      im.onload = () => { charImgOk[key] = true; };
      im.onerror = () => { charImgOk[key] = false; if (key !== base) { renderChars(speaker); } else d.innerHTML = ph; };
      im.src = 'img/char_' + file + '.png';
      d.appendChild(im);
    }
    box.appendChild(d);
  });
}

/* ---------- 打字效果 ---------- */
let typing = null, waitingTap = false;
function typeText(str){
  const el = $('text'); el.textContent = ''; let i = 0;
  clearInterval(typing);
  $('next').classList.add('hidden');
  typing = setInterval(() => {
    i += 1; el.textContent = str.slice(0, i);
    if (i >= str.length) finishTyping(str);
  }, 28);
  el.dataset.full = str;
}

/* ---------- 主流程 ---------- */
function goScene(id){
  if (!STORY.scenes[id]) { alert('找不到場景：' + id); return; }
  S.scene = id; S.idx = 0;
  if (S.cg) { S.cg = ''; setCg(''); }   // 插圖只留在原本的場景
  S.needCard = !!(STORY.scenes[id].title || STORY.scenes[id].sub);
  save(); run();
}

function run(){
  closeOv();
  const sc = STORY.scenes[S.scene];
  setChapter(); updateScore();
  inGame = true; updateMusic();
  if (S.needCard) return showChapterCard(sc);
  while (true) {
    const item = sc.lines[S.idx];
    if (item === undefined) { // 場景沒寫 go，就停在這
      waitingTap = false; $('text').textContent = '（這段還沒寫完）'; return;
    }
    if (typeof item === 'string') return showLine(item);
    if (item.bg !== undefined) { S.bg = item.bg; setBg(item.bg); updateMusic(); S.idx++; continue; }
    if (item.show !== undefined) { S.show = item.show.slice(); renderChars(null); S.idx++; continue; }
    if (item.q) {
      if (S.done[item.q] !== undefined || !QUESTIONS[item.q]) { S.idx++; continue; } // 答過的不重問
      save(); return showQuestion(item.q);
    }
    if (item.cg !== undefined) { S.cg = item.cg || ''; setCg(S.cg); updateMusic(); S.idx++; continue; }   // {cg:'wed_me'} 顯示插圖、{cg:''} 收起
    if (item.set) { Object.assign(S.flags, item.set); S.idx++; continue; }
    if (item.calc) {   // {calc:'heart'}：呼叫 story.js 裡 STORY.calc.heart(旗標)，把結果寫回旗標
      const fn = STORY.calc && STORY.calc[item.calc];
      if (typeof fn === 'function') Object.assign(S.flags, fn(S.flags) || {});
      S.idx++; continue;
    }
    if (item.ifgo) {   // {ifgo:{flag:'s2', eq:'hard', go:'場景'}}：條件成立才跳
      const c = item.ifgo;
      if (S.flags[c.flag] === c.eq) return goScene(c.go);
      S.idx++; continue;
    }
    if (item.ending) { save(); return showEnding(item.ending); }
    if (item.choice) { save(); return showChoice(item.choice); }
    if (item.go) return goScene(item.go);
    if (item.result) { save(); return showResult(item.result, true); }
    S.idx++;
  }
}

function showLine(str){
  const parts = str.split('|');
  const id = parts[0], text = parts[1] || '', nameOverride = parts[2];
  const c = STORY.chars[id];
  const nm = $('name');
  if (id && c) { nm.textContent = nameOverride || c.name; nm.style.background = c.color; nm.style.color = '#111'; }
  else nm.textContent = '';
  $('text').className = id ? '' : 'narr';
  renderChars(id || null);
  typeText(text);
  playVoice(id, text);
  waitingTap = true;
  save();
}

/* ---------- 角色語音（預設關閉；「我」沒有語音） ----------
   每句語音檔名＝角色＋台詞算出的編號（跟 _測試/export_voice_lines.js 一樣），
   台詞改過編號就會變，舊語音自動不播，不會念錯。只播 voice/list.js 裡有的檔。 */
const VOICE_PREF = 'qinyu_love_voice_v1';
const VOICE_SET = new Set(typeof VOICE_KEYS !== 'undefined' && Array.isArray(VOICE_KEYS) ? VOICE_KEYS : []);
let voiceOn = false;
try { voiceOn = localStorage.getItem(VOICE_PREF) === '1'; } catch(e){}
const voiceAudio = new Audio(); voiceAudio.preload = 'auto';
let voiceCur = { who: '', text: '' };
function voiceKey(who, text){
  let h = 2166136261;
  for (const ch of who + '|' + text) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; }
  return who + '_' + h.toString(16).padStart(8, '0');
}
function stopVoice(){ try { voiceAudio.pause(); } catch(e){} }
function playVoice(who, text){
  voiceCur = { who: who || '', text: text || '' };
  stopVoice();
  if (!voiceOn || !who || who === 'me') return;
  const key = voiceKey(who, text);
  if (!VOICE_SET.has(key)) return;
  voiceAudio.src = 'voice/' + key + '.mp3';
  const p = voiceAudio.play(); if (p && p.catch) p.catch(() => {});
}
function updateVoiceBtn(){
  $('voiceBtn').textContent = voiceOn ? '🔊' : '🔇';
  $('voiceBtn').title = voiceOn ? '角色語音：開（點一下關閉）' : '角色語音：關（點一下開啟）';
}
$('voiceBtn').onclick = e => {

  updateVoiceBtn();
  // 開啟時，如果畫面上正停在一句台詞，就馬上念這一句
  if (voiceOn && waitingTap && $('ov').classList.contains('hidden')) playVoice(voiceCur.who, voiceCur.text); else if (!voiceOn) stopVoice();
};

/* ---------- 背景音樂（預設關閉；和語音分開的開關） ----------
   場景對應哪一首寫在 story.js 的 STORY.bgm。用 Web Audio 播放才能無縫循環；
   角色說話時音樂自動變小聲；切到別的分頁或鎖螢幕時暫停。 */
const MUSIC_PREF = 'qinyu_love_music_v1', MUSIC_VOL = 0.35, MUSIC_DUCK = 0.35;
let musicOn = false, inGame = false;
try { musicOn = localStorage.getItem(MUSIC_PREF) === '1'; } catch(e){}
let actx = null, musicMaster = null, musicDuck = null, curTrack = '', curSrc = null, curGain = null;
const musicBufs = {}, musicLoading = {};
function musicTrack(){
  if (!S) return '';
  if (S.cg && S.cg.indexOf('wed') === 0) return 'wedding';          // 婚禮插圖一出現就換婚禮曲
  const cfg = STORY.bgm && STORY.bgm[S.scene];
  if (typeof cfg === 'string') return cfg;
  if (cfg && typeof cfg === 'object') return cfg[S.bg] || cfg['*'] || S.bgm || 'daily';
  return S.bgm || 'daily';                                          // 沒寫的場景沿用上一首
}
function ensureActx(){
  if (actx) return actx;
  const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
  actx = new C();
  musicMaster = actx.createGain(); musicMaster.gain.value = MUSIC_VOL;
  musicDuck = actx.createGain(); musicDuck.gain.value = 1;
  musicMaster.connect(musicDuck); musicDuck.connect(actx.destination);
  return actx;
}
function loadTrack(t){
  if (musicBufs[t]) return Promise.resolve(musicBufs[t]);
  if (musicLoading[t]) return musicLoading[t];
  musicLoading[t] = fetch('bgm/bgm_' + t + '.mp3?v=' + VERSION).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
    .then(ab => new Promise((res, rej) => actx.decodeAudioData(ab, res, rej)))
    .then(b => (musicBufs[t] = b)).catch(() => { musicLoading[t] = null; return null; });
  return musicLoading[t];
}
function fadeOutMusic(){
  if (!curSrc || !actx) return;
  const now = actx.currentTime, s = curSrc, g = curGain;
  g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now); g.gain.linearRampToValueAtTime(0, now + 1.2);
  try { s.stop(now + 1.3); } catch(e){}
  curSrc = null; curGain = null;
}
function playMusic(t){
  if (!musicOn || !t || !ensureActx()) return;
  if (actx.state === 'suspended' && !document.hidden) actx.resume().catch(() => {});
  if (t === curTrack && curSrc) return;
  curTrack = t;
  loadTrack(t).then(buf => {
    if (!buf || !musicOn || curTrack !== t || (curSrc && curSrc._t === t)) return;
    fadeOutMusic();
    const now = actx.currentTime, src = actx.createBufferSource(), g = actx.createGain();
    src.buffer = buf; src.loop = true; src._t = t;
    g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(1, now + 1.5);
    src.connect(g); g.connect(musicMaster); src.start();
    curSrc = src; curGain = g;
  });
}
function updateMusic(){
  if (!S) return;
  const t = musicTrack(); if (t) S.bgm = t;
  if (musicOn && inGame) playMusic(S.bgm);
}
function setDuck(v){
  if (!actx || !musicDuck) return;
  const now = actx.currentTime;
  musicDuck.gain.cancelScheduledValues(now); musicDuck.gain.setValueAtTime(musicDuck.gain.value, now); musicDuck.gain.linearRampToValueAtTime(v, now + 0.3);
}
voiceAudio.addEventListener('play', () => setDuck(MUSIC_DUCK));
voiceAudio.addEventListener('pause', () => setDuck(1));
voiceAudio.addEventListener('ended', () => setDuck(1));
function updateMusicBtn(){
  $('musicBtn').classList.toggle('off', !musicOn);
  $('musicBtn').title = musicOn ? '背景音樂：開（點一下關閉）' : '背景音樂：關（點一下開啟）';
}
$('musicBtn').onclick = e => {
  e.stopPropagation();

  updateMusicBtn();
  if (musicOn) { ensureActx(); if (actx) actx.resume().catch(() => {}); if (inGame) { curTrack = ''; updateMusic(); } }
  else { fadeOutMusic(); curTrack = ''; }
};
// iPad／手機：上次開著音樂，重新打開網頁後要等第一次點畫面才能出聲

/* 依題號固定打亂選項（每次看到順序一樣） */
function shuffled(arr, seedStr){
  let h = 2166136261; for (const ch of seedStr) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  const a = arr.map((v, i) => i);
  for (let i = a.length - 1; i > 0; i--) { h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0; const j = h % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function normInput(s, unit){
  let t = String(s).trim()
    .replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0))
    .replace(/[．。]/g, '.').replace(/[％]/g, '%').replace(/\s+/g, '');
  if (unit) {
    const u = unit.replace(/\s+/g, '').toLowerCase();
    const alts = [u, u.replace('³', '3'), u.replace('ml', 'cc')];
    const low = t.toLowerCase();
    for (const a of alts) if (a && low.endsWith(a)) { t = t.slice(0, t.length - a.length); break; }
  }
  return t;
}

function showQuestion(id){
  waitingTap = false; $('next').classList.add('hidden');
  const q = QUESTIONS[id];
  const pts = q.pts || 10;
  const labs = labelsOf(q);
  const useLab = !!q.labels;
  const typeName = { single:'單選', multi:'複選', order:'排順序', input:'填答' }[q.type] || '';
  let body = '';
  let order = q.options ? q.options.map((v, i) => i) : [];
  if (q.type === 'single' && !useLab && !q.noShuffle) order = shuffled(q.options, id);

  if (q.type === 'single' || q.type === 'multi') {
    body = `<div class="opts ${q.options.length >= 4 ? 'two' : ''}">` + order.map(i => `<button class="btn opt" data-i="${i}">${useLab || q.type === 'multi' ? `<span class="lab">${labs[i]}</span>` : ''}${esc(q.options[i])}</button>`).join('') + '</div>';
    if (q.type === 'multi') body = `<div class="qtip">可以選不只一個，選好按「送出」</div>` + body;
  } else if (q.type === 'order') {
    body = `<div class="qtip">依序點選，排出正確順序</div><div class="seq" id="seq"></div><div class="opts two">` +
      q.options.map((t, i) => `<button class="btn opt" data-i="${i}"><span class="lab">${labs[i]}</span>${esc(t)}</button>`).join('') + '</div>' +
      `<button class="btn ghost" id="seqReset">重排</button>`;
  } else if (q.type === 'input') {
    body = `<div class="inputRow"><input id="ans" inputmode="decimal" autocomplete="off" placeholder="輸入答案">${q.unit ? `<span class="unit">${esc(q.unit)}</span>` : ''}</div>`;
  }
  const needSubmit = q.type !== 'single';
  const figHtml = (q.img ? `<img class="qfig" src="img/${esc(q.img)}" alt="">` : '') +
    (q.fig && typeof FIGS !== 'undefined' && FIGS[q.fig] ? `<div class="qfig">${FIGS[q.fig]}</div>` : '');
  const o = openOv(`<div class="card ${figHtml ? 'hasFig' : ''}">
    <div class="qhead"><span class="tag">理化挑戰・${typeName}</span><span>${S.missed[id] ? '（再試一次，這題已不計分）' : `答對 +${pts}`}</span></div>
    <div class="qgrid"><div class="qleft">
      <div class="qprompt">${esc(q.prompt)}</div>
      ${figHtml}
    </div><div class="qright">
      ${body}
      ${needSubmit ? `<button class="btn primary" id="submit">送出</button>` : ''}
      <div class="fb" id="fb"></div>
      ${DEV ? `<div class="dev">【測試模式】答案：${esc(q.answer)}　題號：${id}</div>` : ''}
    </div></div>
  </div>`, true);
  o.onclick = e => e.stopPropagation();

  let sel = new Set(), seq = [], locked = false;
  const fb = $('fb');
  const check = (given) => {
    if (locked) return; locked = true;
    let ok = false;
    if (q.type === 'single') ok = given === q.answer;
    if (q.type === 'multi') ok = [...given].sort().join('') === [...q.answer].sort().join('');
    if (q.type === 'order') ok = given === q.answer;
    if (q.type === 'input') ok = normInput(given, q.unit) === normInput(q.answer, q.unit);
    if (ok) {
      const gain = S.missed[id] ? 0 : pts;
      S.done[id] = gain; recalcScore(); updateScore(); save();
      fb.className = 'fb ok'; fb.textContent = gain ? `答對了！+${gain}` : '答對了！';
      setTimeout(() => { S.idx++; save(); run(); }, 900);
    } else {
      S.missed[id] = true; S.wrong++; save();
      fb.className = 'fb bad'; fb.textContent = '再想想看～' + (q.hint ? '（提示：' + q.hint + '）' : '');
      o.querySelector('.qhead span:last-child').textContent = '（再試一次，這題已不計分）';
      setTimeout(() => { locked = false; }, 700);
    }
  };
  o.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (locked) return;
    const i = +b.dataset.i;
    if (q.type === 'single') { o.querySelectorAll('.opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); check(q.options[i]); }
    if (q.type === 'multi') { sel.has(i) ? sel.delete(i) : sel.add(i); b.classList.toggle('sel'); }
    if (q.type === 'order') { if (!seq.includes(i)) { seq.push(i); b.classList.add('sel'); $('seq').textContent = seq.map(k => labs[k]).join(''); } }
  });
  const rs = $('seqReset'); if (rs) rs.onclick = () => { seq = []; $('seq').textContent = ''; o.querySelectorAll('.opt').forEach(x => x.classList.remove('sel')); };
  const sb = $('submit');
  if (sb) sb.onclick = () => {
    if (q.type === 'multi') { if (!sel.size) return; check([...sel].map(i => labs[i]).join('')); }
    if (q.type === 'order') { if (seq.length !== q.options.length) { fb.className='fb bad'; fb.textContent='要全部排完喔'; return; } check(seq.map(i => labs[i]).join('')); }
    if (q.type === 'input') { const v = $('ans').value; if (!v.trim()) return; check(v); }
  };
  const ans = $('ans'); if (ans) { ans.addEventListener('keydown', e => { if (e.key === 'Enter') sb.click(); }); setTimeout(() => ans.focus(), 50); }
}

/* ---------- 成績卡 ---------- */
function fmtTime(ms){ const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60; return `${m} 分 ${String(s).padStart(2,'0')} 秒`; }
function showResult(kind, fromStory){

  const badge = S.ended ? `<span class="badge clear">故事結束${lastEnd ? '・結局：' + esc(lastEnd.name) : ''}</span>` : '<span class="badge prog">遊戲進行中</span>';

    <div class="max">積分（滿分 ${MAX_SCORE}）</div>
    <div class="stats">
      <div>答過的題目<b>${answered} / ${total}</b></div>
      <div>答錯次數<b>${S.wrong}</b></div>
      <div>遊玩時間<b>${fmtTime(S.playMs)}</b></div>
      <div>第幾次遊玩<b>第 ${S.plays} 次</b></div>
    </div>
    ${endingListHtml()}
    <div style="color:var(--dim);font-size:14px">${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}　${VERSION}　© 2026 蕭妤真</div>
    ${fromStory && kind === 'end' && (S.checkpoints || []).length ? '<button class="btn primary" id="rcp">回到分歧點，看看別的結局</button>' : ''}
    ${fromStory && kind === 'end' ? '<button class="btn" id="rnew">重新開始一輪</button>' : ''}
    ${!fromStory ? '<button class="btn primary" id="rback">回到遊戲</button>' : ''}
  </div>`);
  o.onclick = e => e.stopPropagation();
  if ($('rback')) $('rback').onclick = () => { closeOv(); resumeView(); };
  if ($('rnew')) $('rnew').onclick = () => confirmRestart();
  if ($('rcp')) $('rcp').onclick = () => showCheckpoints();
}

/* ---------- 選單 ---------- */
function showMenu(){
  const devJump = DEV ? `<label class="f">【測試】跳到場景</label><select id="jump" style="width:100%;font-size:18px;padding:8px;border-radius:10px;background:#0f1120;color:#fff">${Object.keys(STORY.scenes).map(k => `<option value="${k}">${k}　${esc(STORY.scenes[k].sub || '')}</option>`).join('')}</select><button class="btn" id="jumpGo">跳過去</button>` : '';
  const o = openOv(`<div class="card"><div class="qhead"><span class="tag">選單</span></div>
    <button class="btn" id="mBack">回到遊戲</button>
    <button class="btn" id="mScore">看我的成績卡</button>
    <button class="btn" id="mCp">回到分歧點（${(S.checkpoints || []).length}）</button>
    <button class="btn" id="mRestart">重新開始</button>
    ${devJump}
    <div style="color:var(--dim);font-size:13px;margin-top:10px">進度會自動存在這台裝置上。${VERSION}</div></div>`);
  o.onclick = e => { if (e.target === o) { closeOv(); resumeView(); } };
  $('mBack').onclick = () => { closeOv(); resumeView(); };
  $('mScore').onclick = () => showResult(null, false);
  $('mRestart').onclick = () => confirmRestart();
  $('mCp').onclick = () => showCheckpoints();
  if ($('jumpGo')) $('jumpGo').onclick = () => goScene($('jump').value);
}
function confirmRestart(){
  const o = openOv(`<div class="card"><div class="qhead"><span class="tag">重新開始</span></div>
    <div class="qprompt">確定要從頭開始嗎？目前的積分會歸零。</div>
    <button class="btn primary" id="yes">確定重新開始</button><button class="btn ghost" id="no">取消</button></div>`);
  o.onclick = e => e.stopPropagation();
  $('yes').onclick = () => newGame(S ? S.name : '', (S ? S.plays : 0) + 1);
  $('no').onclick = () => { closeOv(); resumeView(); };
}
$('menuBtn').onclick = e => { e.stopPropagation(); if (S) showMenu(); };

/* 從選單回來時，重畫目前那一格（不前進） */
function resumeView(){
  const sc = STORY.scenes[S.scene];
  inGame = true; updateMusic();   // 「繼續遊戲」也走這裡，要接上音樂
  if (S.needCard) return showChapterCard(sc);
  const item = sc.lines[S.idx];
  if (typeof item === 'string') { showLine(item); finishTyping(); }
  else run();
}

/* ---------- 全螢幕 ---------- */
(function(){
  const el = document.documentElement;
  const can = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!can) { $('fsBtn').classList.add('hidden'); return; }
  $('fsBtn').onclick = e => {
    e.stopPropagation();
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    try {
      if (fsEl) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else {
        const r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
        // Android 全螢幕時可以鎖定橫向；iPhone/iPad 不支援，會靠「請轉橫向」提示
        const lockLand = () => { try { screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {}); } catch (e2) {} };
        if (r && r.then) r.then(lockLand).catch(() => {}); else lockLand();
      }
    } catch (err) {}
  };
})();

/* ---------- 開始畫面 ---------- */
function newGame(name, plays){
  S = fixState({ name, plays: plays || 1, scene: STORY.start, idx: 0, started: Date.now() });
  S.needCard = true; save();
  setBg('classroom'); setCg(''); renderChars(null); run();
}
function titleScreen(){
  setBg('chapel'); setCg('');
  $('chars').innerHTML = '';
  const has = S && (S.idx > 0 || S.scene !== STORY.start || S.score > 0);
  const o = openOv(`<div class="card title">
    <h1>秦宇的愛情</h1><div class="subt">理化文字冒險遊戲</div><div class="subt" style="margin-top:-18px;font-size:14px">© 2026 蕭妤真　版權所有</div>
    ${has ? `<button class="btn primary" id="tCont">繼續遊戲（${esc(S.name)}・積分 ${S.score}）</button>` : ''}
    <label class="f">座號＋姓名（成績卡會顯示）</label>
    <input class="name" id="tName" maxlength="20" placeholder="例如：805 王小明" value="${has ? esc(S.name) : ''}">
    <button class="btn ${has ? '' : 'primary'}" id="tNew">${has ? '從頭開始新遊戲' : '開始遊戲'}</button>
    <div class="fb bad" id="tErr"></div>
    ${endingListHtml()}
  </div>`);
  o.onclick = e => e.stopPropagation();
  if ($('tCont')) $('tCont').onclick = () => { closeOv(); setBg(S.bg || 'classroom'); setCg(S.cg); renderChars(null); resumeView(); };
  $('tNew').onclick = () => {
    const nm = $('tName').value.trim();
    if (!nm) { $('tErr').textContent = '請先輸入座號＋姓名'; return; }
    if (has) {
      const plays = S.plays + 1;
      openOv(`<div class="card"><div class="qprompt">確定從頭開始？目前進度（積分 ${S.score}）會被清掉。</div>
        <button class="btn primary" id="y">確定</button><button class="btn ghost" id="n">取消</button></div>`).onclick = e => e.stopPropagation();
      $('y').onclick = () => newGame(nm, plays);
      $('n').onclick = () => titleScreen();
    } else newGame(nm, 1);
  };
}

$('ver').textContent = '© 2026 蕭妤真　' + VERSION + (DEV ? '・測試模式' : '');
if (S) recalcScore();
titleScreen();
</script>
</body>
</html>
